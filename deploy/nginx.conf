# Baquu Platform — Nginx Reverse Proxy
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to your Nginx sites directory:
#      sudo cp /var/www/baquu-platform/deploy/nginx.conf /etc/nginx/sites-available/baquu-platform
#
# 2. Enable the site:
#      sudo ln -s /etc/nginx/sites-available/baquu-platform /etc/nginx/sites-enabled/
#
# 3. Replace YOUR_DOMAIN.com with your actual domain name
#
# 4. Test and reload Nginx:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 5. (Optional) Add SSL with Let's Encrypt:
#      sudo apt install certbot python3-certbot-nginx -y
#      sudo certbot --nginx -d YOUR_DOMAIN.com -d www.YOUR_DOMAIN.com

server {
    server_name sirfpk.com www.sirfpk.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Serve static assets directly (Vite build output)
    location /assets/ {
        alias /var/www/baquu-platform/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy everything else to the Node.js app
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sirfpk.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sirfpk.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.sirfpk.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sirfpk.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sirfpk.com www.sirfpk.com;
    return 404; # managed by Certbot




}