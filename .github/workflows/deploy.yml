name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'
          set -e

          APP_DIR="/var/www/baquu-platform"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          BRANCH="main"
          SERVICE_NAME="baquu-platform"

          echo "🚀 Starting deployment..."
          echo "📁 App directory: $APP_DIR"

          # ── Clone or pull ──
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "📥 First deploy — cloning repository..."
            sudo mkdir -p "$APP_DIR"
            sudo chown $USER:$USER "$APP_DIR"
            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
          else
            echo "📥 Pulling latest changes..."
            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd
          fi

          cd "$APP_DIR"

          # ── Install dependencies ──
          echo "📦 Installing dependencies..."
          npm ci --production=false

          # ── Build ──
          echo "🔨 Building application..."
          npm run build

          # ── Setup/update systemd service ──
          echo "⚙️  Updating systemd service..."
          sudo cp "$APP_DIR/deploy/baquu-platform.service" /etc/systemd/system/${SERVICE_NAME}.service
          sudo systemctl daemon-reload
          sudo systemctl enable ${SERVICE_NAME}

          # ── Load env file if exists ──
          if [ ! -f "$APP_DIR/.env" ]; then
            echo "⚠️  No .env file found. Copy .env.example and fill in your values:"
            echo "   cp $APP_DIR/.env.example $APP_DIR/.env"
          fi

          # ── Restart service ──
          echo "🔄 Restarting service..."
          sudo systemctl restart ${SERVICE_NAME}

          # ── Verify ──
          sleep 3
          if sudo systemctl is-active --quiet ${SERVICE_NAME}; then
            echo "✅ Deployment successful! Service is running."
          else
            echo "❌ Service failed to start. Checking logs..."
            sudo journalctl -u ${SERVICE_NAME} --no-pager -n 20
            exit 1
          fi

          echo "🎉 Deployment complete!"
          DEPLOY_SCRIPT
